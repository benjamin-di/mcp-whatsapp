# Fork-only: builds the integration branch (upstream main + our open PR branches)
# into ghcr.io/benjamin-di/mcp-whatsapp so a deployment can pin it by digest until
# upstream publishes images that include the PRs. Not offered upstream.
name: integration image

on:
  push:
    branches: [integration]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Version
        id: v
        run: |
          base=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          echo "tag=${base#v}-int.${GITHUB_RUN_NUMBER}.$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.tag }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        run: echo "ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
